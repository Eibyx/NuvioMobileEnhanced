name: CI

# Unit tests and an installable debug APK (independent jobs: a test failure stays red
# but does not hide the APK) for every push to the Avix branches and every pull request.
# The APK is attached to the run as an artifact (Actions tab → run → Artifacts),
# which can be downloaded from the GitHub mobile app or a phone browser.

on:
  push:
    branches: [cmp-rewrite, "integration/**", "experiment/**", "fix/avix-artwork-root-cause"]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_artifact_run:
        description: "Optional: verify an existing artwork diagnostic CI artifact without rebuilding"
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !inputs.verify_artifact_run }}
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Optional: base64 of a local.properties with backend and integration values.
      # See BUILDING.md. Missing values only disable the features that need them.
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
      # Nuvio account backend (DECISIONS D-6). The URL is public; the publishable key is a secret
      # of this repository so it is not committed. Read by composeApp/build.gradle.kts.
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      # OAuth client IDs (public identifiers, never client secrets). Precedence:
      # dedicated secret > the same key in NUVIO_LOCAL_PROPERTIES_BASE64 > not configured.
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/cmp-rewrite' }}

      - name: Write local.properties
        shell: bash
        run: |
          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            echo "local.properties written from secret ($(grep -c '=' local.properties) entries; values not printed)."
          else
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 is not set (optional: TMDB/Trakt/... keys)."
          fi

      - name: Unit tests
        run: >
          ./gradlew --stacktrace
          :composeApp:testAndroidHostTest
          -Pnuvio.android.distribution=full
          -Pnuvio.ios.distribution=appstore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  apk:
    if: ${{ !inputs.verify_artifact_run }}
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Optional: base64 of a local.properties with backend and integration values.
      # See BUILDING.md. Missing values only disable the features that need them.
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
      # Nuvio account backend (DECISIONS D-6). The URL is public; the publishable key is a secret
      # of this repository so it is not committed. Read by composeApp/build.gradle.kts.
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      # OAuth client IDs (public identifiers, never client secrets). Precedence:
      # dedicated secret > the same key in NUVIO_LOCAL_PROPERTIES_BASE64 > not configured.
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/cmp-rewrite' }}

      - name: Write local.properties
        shell: bash
        run: |
          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            echo "local.properties written from secret ($(grep -c '=' local.properties) entries; values not printed)."
          else
            : > local.properties
            echo "NUVIO_LOCAL_PROPERTIES_BASE64 is not set (optional: TMDB/Trakt/... keys)."
          fi

      - name: Nuvio backend configuration
        id: backend
        shell: bash
        run: |
          # Values are never printed: only whether they are present (and the key length).
          url="${NUVIO_SUPABASE_URL}"
          key="${NUVIO_SUPABASE_ANON_KEY}"
          if [ -f local.properties ]; then
            grep -q '^NUVIO_SUPABASE_URL=..*' local.properties && url="(local.properties)"
            grep -q '^NUVIO_SUPABASE_ANON_KEY=..*' local.properties && key="(local.properties)"
          fi
          if [ -n "${url}" ] && [ -n "${key}" ]; then
            echo "Nuvio backend: configured (URL ${url%%/rest*}, publishable key ${#key} chars)"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Nuvio account login disabled::Set the repository secret NUVIO_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions). This APK can only be used without an account."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: OAuth providers configuration
        shell: bash
        run: |
          # Values are never printed: only whether each client ID is configured and where from.
          for key in ANILIST_CLIENT_ID MAL_CLIENT_ID TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            source="not configured"
            if [ -n "${!key}" ]; then
              source="configured (repository secret ${key})"
            elif [ -f local.properties ] && grep -q "^${key}=..*" local.properties; then
              source="configured (NUVIO_LOCAL_PROPERTIES_BASE64)"
            fi
            echo "${key%_CLIENT_ID}: ${source}"
            if [ "${source}" = "not configured" ]; then
              echo "::notice title=${key%_CLIENT_ID} not configured::Add the repository secret ${key} to enable it in this APK."
            fi
          done

      - name: Build debug APK
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == "refs/heads/fix/avix-artwork-root-cause" ]]; then
            args+=(-Pavix.artworkDiagnostics=true
                   -Pavix.debug.applicationId=com.eibyx.nuvio.artworkfix.debug
                   -Pavix.debug.abis=arm64-v8a)
          else
            args+=(-Pavix.versionCode=$((100000 + GITHUB_RUN_NUMBER)))
          fi
          ./gradlew --stacktrace :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore "${args[@]}"

      - name: Rename debug APK
        shell: bash
        run: |
          mkdir -p dist
          apk=$(ls androidApp/build/outputs/apk/full/debug/*.apk | head -1)
          name=Nuvio-Eibyx-Debug.apk
          if [[ "$GITHUB_REF" == "refs/heads/fix/avix-artwork-root-cause" ]]; then
            name=NuvioEibyx-Artwork-Diagnostics-ARM64-Debug.apk
            python3 - "$apk" <<'PYVERIFY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              native = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert native and {n.split('/')[1] for n in native} == {'arm64-v8a'}
              assert {'libmpv.so', 'libplayer.so', 'libc++_shared.so', 'libass.so'} <= {n.split('/')[-1] for n in native}
              for n in native:
                  h = z.read(n)[:20]
                  assert h[:5] == b'\x7fELF\x02' and int.from_bytes(h[18:20], 'little') == 183
          PYVERIFY
          fi
          cp "$apk" "dist/$name"
          git rev-parse HEAD > dist/COMMIT.txt
          (cd dist && sha256sum "$name" > SHA256SUMS)

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Eibyx-Debug-${{ github.run_number }}${{ steps.backend.outputs.configured != 'true' && '-sin-cuenta' || '' }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify-diagnostic-artifact:
    name: Verify existing diagnostic APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_artifact_run != '' && github.ref == 'refs/heads/fix/avix-artwork-root-cause' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.verify_artifact_run }}
    steps:
      - name: Download the successful diagnostic run's artifact
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > source-artifacts.json
          artifact_name=$(python3 - <<'PY'
          import json, re
          run = json.load(open('source-run.json'))
          assert run['head_branch'] == 'fix/avix-artwork-root-cause'
          assert run['name'] == 'CI' and run['conclusion'] == 'success'
          artifacts = json.load(open('source-artifacts.json'))['artifacts']
          matches = [a['name'] for a in artifacts if re.fullmatch(r'Nuvio-Eibyx-Debug-\d+(?:-sin-cuenta)?', a['name']) and not a['expired']]
          assert len(matches) == 1
          print(matches[0])
          PY
          )
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir verification

      - name: Verify signature, identity, checksum and ARM64 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path
          directory = Path('verification')
          apks = list(directory.glob('*.apk'))
          assert len(apks) == 1
          apk = apks[0]
          commit = (directory / 'COMMIT.txt').read_text().strip()
          assert commit == json.load(open('source-run.json'))['head_sha']
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          checksum, filename = (directory / 'SHA256SUMS').read_text().strip().split(maxsplit=1)
          assert checksum == digest and filename.strip() == apk.name
          build_tools = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          tools = sorted(p for p in build_tools.iterdir() if (p/'apksigner').exists() and (p/'aapt').exists())[-1]
          signature = subprocess.check_output([str(tools/'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          assert 'CN=Android Debug' in signature
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
          cert = re.search(r'certificate SHA-256 digest: (\w+)', signature).group(1)
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "package: name='com.eibyx.nuvio.artworkfix.debug'" in badging
          assert 'application-debuggable' in badging and "native-code: 'arm64-v8a'" in badging
          manifest = subprocess.check_output([str(tools/'aapt'), 'dump', 'xmltree', str(apk), 'AndroidManifest.xml'], text=True)
          assert re.search(r'ARTWORK_DIAGNOSTICS[^\n]*\n[^\n]*android:value[^\n]*0xffffffff', manifest)
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              native = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert native and {n.split('/')[1] for n in native} == {'arm64-v8a'}
              assert {'libmpv.so','libplayer.so','libass.so','libasskt.so','libc++_shared.so'} <= {Path(n).name for n in native}
              for n in native:
                  h = z.read(n)[:20]
                  assert h[:5] == b'\x7fELF\x02' and int.from_bytes(h[18:20], 'little') == 183
              # Public checksum of the unchanged mpvlib 1.1.3 ARM64 C++ runtime.
              cpp = hashlib.sha256(z.read('lib/arm64-v8a/libc++_shared.so')).hexdigest()
              assert cpp == 'b5d97c38a728afe28d341cda3369f512d35eaf9c680c1b0563cd6a63e395230f'
          report = dict(file=apk.name, bytes=apk.stat().st_size, sha256=digest, commit=commit,
                        applicationId='com.eibyx.nuvio.artworkfix.debug', abi='arm64-v8a',
                        elfLibraries=len(native), debugSignatureV2=True, certificateSha256=cert,
                        zipIntegrity=True, cppRuntimeMatchesMpvRx=True, diagnosticCapability=True)
          # Accessible through the Checks API even if the caller's network blocks Blob downloads.
          print('::notice title=Verified diagnostic APK::' + json.dumps(report))
          PY

