name: CI

# Unit tests and an installable debug APK (independent jobs: a test failure stays red
# but does not hide the APK) for every push to the Avix branches and every pull request.
# The APK is attached to the run as an artifact (Actions tab → run → Artifacts),
# which can be downloaded from the GitHub mobile app or a phone browser.

on:
  push:
    branches: [cmp-rewrite, "integration/**", "experiment/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Optional: base64 of a local.properties with backend and integration values.
      # See BUILDING.md. Missing values only disable the features that need them.
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/cmp-rewrite' }}

      - name: Write local.properties
        shell: bash
        run: |
          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            echo "local.properties written from secret ($(grep -c '=' local.properties) entries; values not printed)."
          else
            : > local.properties
            echo "::notice::NUVIO_LOCAL_PROPERTIES_BASE64 is not set. The APK builds, but account sync and keyed integrations stay disabled."
          fi

      - name: Unit tests
        run: >
          ./gradlew --stacktrace
          :composeApp:testAndroidHostTest
          -Pnuvio.android.distribution=full
          -Pnuvio.ios.distribution=appstore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Optional: base64 of a local.properties with backend and integration values.
      # See BUILDING.md. Missing values only disable the features that need them.
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/cmp-rewrite' }}

      - name: Write local.properties
        shell: bash
        run: |
          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
            echo "local.properties written from secret ($(grep -c '=' local.properties) entries; values not printed)."
          else
            : > local.properties
            echo "::notice::NUVIO_LOCAL_PROPERTIES_BASE64 is not set. The APK builds, but account sync and keyed integrations stay disabled."
          fi

      - name: Build debug APK
        run: >
          ./gradlew --stacktrace
          :androidApp:assembleFullDebug
          -Pnuvio.android.distribution=full
          -Pnuvio.ios.distribution=appstore
          -Pavix.versionCode=$((100000 + GITHUB_RUN_NUMBER))

      - name: Rename debug APK
        shell: bash
        run: |
          mkdir -p dist
          apk=$(ls androidApp/build/outputs/apk/full/debug/*.apk | head -1)
          cp "$apk" dist/Nuvio-Avix-Debug.apk
          (cd dist && sha256sum Nuvio-Avix-Debug.apk | tee Nuvio-Avix-Debug.apk.sha256)

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Avix-Debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

