name: Release

# Signed release APK(s) published as a GitHub Release. By default only the arm64-v8a APK
# (Nuvio-Eibyx-Release-arm64-v8a.apk); the "abis" input "all" builds every ABI + universal.
# Run manually from the Actions tab, push a tag named v<version>-avix.<n>, or change
# .github/release-request on an integration branch (the workflow then names the tag itself).
# Versions are semver prereleases (X.Y.Z-avix.N) so the in-app updater (Beta channel,
# Eibyx/NuvioMobileEnhanced releases) offers them in order.
# Refuses to run without a release keystore: release APKs are never signed with the debug key.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: true
      abis:
        description: 'ABIs to build: comma-separated (e.g. arm64-v8a) or "all" (every ABI + universal)'
        type: string
        default: arm64-v8a
  push:
    tags:
      - "v*-avix.*"
    # Also when .github/release-request changes on an integration branch (for sessions that can
    # push commits but not tags). Path filters do not apply to tag pushes.
    branches: ["integration/**"]
    paths:
      - ".github/release-request"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      KEYSTORE_BASE64: ${{ secrets.AVIX_RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.AVIX_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.AVIX_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.AVIX_RELEASE_KEY_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
      # Tag pushes have no inputs: they build the arm64-v8a APK only.
      RELEASE_ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      # Nuvio account backend (DECISIONS D-6). The URL is public; the publishable key is a secret
      # of this repository so it is not committed. Read by composeApp/build.gradle.kts.
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      # OAuth client IDs (public identifiers, never client secrets). Precedence:
      # dedicated secret > the same key in NUVIO_LOCAL_PROPERTIES_BASE64 > not configured.
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Check signing secrets
        shell: bash
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing release signing secrets: ${missing[*]}. See BUILDING.md."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare signing and local.properties
        shell: bash
        run: |
          keystore_path="${RUNNER_TEMP}/avix-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          if [ -n "${LOCAL_PROPERTIES_BASE64}" ]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            : > local.properties
            echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 is not set; account sync and keyed integrations are disabled in this release."
          fi
          {
            printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}"
            printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "${KEY_ALIAS}"
            printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "${KEY_PASSWORD}"
          } >> local.properties

      - name: Nuvio backend configuration
        id: backend
        shell: bash
        run: |
          # Values are never printed: only whether they are present (and the key length).
          url="${NUVIO_SUPABASE_URL}"
          key="${NUVIO_SUPABASE_ANON_KEY}"
          if [ -f local.properties ]; then
            grep -q '^NUVIO_SUPABASE_URL=..*' local.properties && url="(local.properties)"
            grep -q '^NUVIO_SUPABASE_ANON_KEY=..*' local.properties && key="(local.properties)"
          fi
          if [ -n "${url}" ] && [ -n "${key}" ]; then
            echo "Nuvio backend: configured (URL ${url%%/rest*}, publishable key ${#key} chars)"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Nuvio account login disabled::Set the repository secret NUVIO_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions). This APK can only be used without an account."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Refusing to publish a release without the Nuvio backend configuration."
            exit 1
          fi

      - name: OAuth providers configuration
        shell: bash
        run: |
          # Values are never printed: only whether each client ID is configured and where from.
          for key in ANILIST_CLIENT_ID MAL_CLIENT_ID TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID; do
            source="not configured"
            if [ -n "${!key}" ]; then
              source="configured (repository secret ${key})"
            elif [ -f local.properties ] && grep -q "^${key}=..*" local.properties; then
              source="configured (NUVIO_LOCAL_PROPERTIES_BASE64)"
            fi
            echo "${key%_CLIENT_ID}: ${source}"
            if [ "${source}" = "not configured" ]; then
              echo "::notice title=${key%_CLIENT_ID} not configured::Add the repository secret ${key} to enable it in this APK."
            fi
          done

      - name: Resolve version
        id: version
        shell: bash
        run: |
          base=$(grep -E '^MARKETING_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2)
          code=$((200000 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF}" == refs/tags/v*-avix.* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${base}-avix.${code}"
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: >
          ./gradlew --stacktrace
          :composeApp:testAndroidHostTest
          -Pnuvio.android.distribution=full
          -Pnuvio.ios.distribution=appstore

      - name: Build release APKs
        shell: bash
        run: |
          abi_flag=()
          if [ "${RELEASE_ABIS}" != "all" ]; then abi_flag=("-Pavix.abis=${RELEASE_ABIS}"); fi
          echo "ABIs: ${RELEASE_ABIS}"
          ./gradlew --stacktrace \
            :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pavix.versionCode=${{ steps.version.outputs.code }} \
            -Pnuvio.app.versionName=${{ steps.version.outputs.name }} \
            "${abi_flag[@]}"

      - name: Verify package, ABIs and native libraries
        shell: bash
        run: |
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            echo "== $(basename "${apk}")"
            "${build_tools}/aapt2" dump badging "${apk}" | grep -E "^package|application-label:|native-code"
            "${build_tools}/aapt2" dump badging "${apk}" | grep -q "^package: name='com.eibyx.nuvio' " \
              || { echo "::error::${apk}: package is not com.eibyx.nuvio"; exit 1; }
            python3 .github/scripts/verify-release-apk.py "${apk}" "${RELEASE_ABIS}" androidApp/build/outputs/mapping/fullRelease/mapping.txt
          done

      - name: Verify signatures and checksums
        id: files
        shell: bash
        run: |
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir -p dist
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            "${apksigner}" verify --print-certs "${apk}" | grep -E 'Signer #1 certificate (DN|SHA-256)'
            if "${apksigner}" verify --print-certs "${apk}" | grep -q 'CN=Android Debug'; then
              echo "::error::${apk} is signed with a debug certificate"; exit 1
            fi
            variant=$(basename "${apk}" | sed -E 's/^androidApp-full-//; s/-release(-unsigned)?\.apk$//')
            if [ "${variant}" = "universal" ]; then name="Nuvio-Eibyx-Release.apk"; else name="Nuvio-Eibyx-Release-${variant}.apk"; fi
            cp "${apk}" "dist/${name}"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Eibyx-Release-${{ steps.version.outputs.code }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Nuvio Eibyx ${{ steps.version.outputs.base }} (${{ steps.version.outputs.code }})" \
            --notes-file CHANGELOG.md \
            ${prerelease_flag}
