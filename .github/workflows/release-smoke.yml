name: Release R8 smoke test

# Runtime check of the R8-minified release build, which unit tests and debug emulator tests do not
# exercise: builds the release variant (same R8 and ProGuard rules as android-release.yml) for
# x86_64, verifies native libraries and JNI bindings, installs it on an API 35 16 KB-page emulator
# and starts it. The APK is signed with a throwaway debug key only to install it on the emulator;
# nothing is uploaded except logcat and a screenshot. Never published.

on:
  push:
    branches: ["integration/**", "experiment/**"]
    paths:
      - "androidApp/build.gradle.kts"
      - "composeApp/build.gradle.kts"
      - "composeApp/proguard-rules.pro"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/release-smoke.yml"
      - ".github/scripts/verify-release-apk.py"
      - ".github/scripts/release-startup-smoke.sh"
  workflow_dispatch:

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: R8 release startup (API 35 x86_64, 16 KB pages)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Empty local.properties (no release key, so the APK is built unsigned)
        run: ": > local.properties"

      - name: Build R8 release (x86_64)
        run: >
          ./gradlew --stacktrace
          :androidApp:assembleFullRelease
          -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore
          -Pavix.abis=x86_64

      - name: Verify native libraries and JNI bindings
        run: >
          python3 .github/scripts/verify-release-apk.py
          androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release-unsigned.apk
          x86_64 androidApp/build/outputs/mapping/fullRelease/mapping.txt

      - name: Sign with a throwaway key for the emulator only
        shell: bash
        run: |
          keytool -genkeypair -keystore "${RUNNER_TEMP}/smoke.jks" -storepass android -keypass android \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Android Debug,O=Android,C=US"
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          "${build_tools}/apksigner" sign --ks "${RUNNER_TEMP}/smoke.jks" --ks-pass pass:android \
            --out smoke.apk androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release-unsigned.apk

      - name: Start the release build on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/release-startup-smoke.sh smoke.apk com.eibyx.nuvio

      - name: Upload logcat and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-logs
          path: release-smoke/
          if-no-files-found: warn
          retention-days: 14
