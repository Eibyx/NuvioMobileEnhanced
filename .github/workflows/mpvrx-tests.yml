name: mpvRx engine tests

# Instrumented smoke test of the mpvRx libmpv engine (MpvRxEngineSmokeTest) on emulators:
# - API 34 x86_64 (4 KB pages)
# - API 35 x86_64 with 16 KB pages (google_apis_ps16k)
# Headless (vo=null/ao=null): proves JNI, decode, tracks, ASS events, seek, charset, HTTP
# headers and repeated create/destroy. It is NOT an audiovisual/libass rendering proof.

on:
  push:
    branches: ["integration/**", "experiment/**"]
    paths:
      - "composeApp/src/androidMain/kotlin/com/nuvio/app/features/player/**"
      - "composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/**"
      - "composeApp/src/androidLibmpv*/**"
      - "androidApp/src/androidTest/**"
      - "androidApp/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "composeApp/build.gradle.kts"
      - ".github/workflows/mpvrx-tests.yml"
  pull_request:
    paths:
      - "composeApp/src/androidMain/kotlin/com/nuvio/app/features/player/**"
      - "composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/**"
      - "composeApp/src/androidLibmpv*/**"
      - "androidApp/src/androidTest/**"
      - "androidApp/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "composeApp/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: mpvrx-tests-${{ github.ref }}
  # Emulator results are evidence (docs/TESTING.md): let a started run finish.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  emulator:
    name: Smoke test (API ${{ matrix.api }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: google_apis
          - api: 35
            target: google_apis_ps16k
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Empty local.properties
        run: ": > local.properties"

      - name: Build app and test APKs
        run: >
          ./gradlew --stacktrace
          :androidApp:assembleFullDebug :androidApp:assembleFullDebugAndroidTest
          -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore

      - name: Run MpvRxEngineSmokeTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell getconf PAGE_SIZE || true
            ./gradlew --stacktrace :androidApp:connectedFullDebugAndroidTest -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pandroid.testInstrumentationRunnerArguments.class=com.nuvio.android.MpvRxEngineSmokeTest
            adb logcat -d -s MpvRxEngineSmokeTest:I > mpvrx-logcat.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpvrx-tests-api${{ matrix.api }}-${{ matrix.target }}
          path: |
            androidApp/build/outputs/androidTest-results/
            androidApp/build/reports/androidTests/
            mpvrx-logcat.txt
          if-no-files-found: warn
          retention-days: 14
